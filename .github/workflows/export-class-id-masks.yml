name: Export class-id masks

on:
  push:
    branches:
      - main

jobs:
  export-and-copy:
    name: Export masks and copy to lulc-cei
    runs-on:
      - self-hosted
      - Windows
      - desktop
    env:
      CEI_DATA_DIR: ${{ vars.CEI_DATA_DIR }}

    steps:
      - name: Checkout CEI-Dataset
        uses: actions/checkout@v6

      - name: Set up Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
          }

          if ($python) {
            "PYTHON=$($python.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $version = "3.11.9"
          $pythonDir = Join-Path $env:RUNNER_TEMP "python-$version-embed-amd64"
          $pythonExe = Join-Path $pythonDir "python.exe"

          if (-not (Test-Path -Path $pythonExe -PathType Leaf)) {
            $zipPath = Join-Path $env:RUNNER_TEMP "python-$version-embed-amd64.zip"
            $getPipPath = Join-Path $env:RUNNER_TEMP "get-pip.py"
            $pythonUrl = "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip"
            $getPipUrl = "https://bootstrap.pypa.io/get-pip.py"

            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $pythonUrl -OutFile $zipPath -UseBasicParsing

            if (Test-Path -Path $pythonDir -PathType Container) {
              Remove-Item -Path $pythonDir -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
            Expand-Archive -LiteralPath $zipPath -DestinationPath $pythonDir -Force

            $pthPath = Join-Path $pythonDir "python311._pth"
            (Get-Content -Path $pthPath) -replace "#import site", "import site" |
              Set-Content -Path $pthPath -Encoding ASCII

            Invoke-WebRequest -Uri $getPipUrl -OutFile $getPipPath -UseBasicParsing
            & $pythonExe $getPipPath --no-warn-script-location
          }

          & $pythonExe --version
          & $pythonExe -m pip --version
          "PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: powershell
        run: |
          & "$env:PYTHON" -m pip install -r requirements.txt

      - name: Export RGB masks to class-id masks
        shell: powershell
        run: |
          & "$env:PYTHON" rgb_to_class_id.py --stats

      - name: Copy masks to lulc-cei
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CEI_DATA_DIR)) {
            Write-Error "Missing GitHub Actions variable: CEI_DATA_DIR. Set it to the absolute path of the CEI_data folder on the Windows Desktop runner."
            exit 1
          }

          if (-not (Test-Path -Path $env:CEI_DATA_DIR -PathType Container)) {
            Write-Error "Expected destination directory does not exist: $env:CEI_DATA_DIR"
            exit 1
          }

          $destMasks = Join-Path $env:CEI_DATA_DIR "masks"
          New-Item -ItemType Directory -Force -Path $destMasks | Out-Null
          Copy-Item -Path "data\masks\*" -Destination $destMasks -Recurse -Force

      - name: Install CEI split dependencies
        shell: powershell
        run: |
          & "$env:PYTHON" -m pip install opencv-python-headless

      - name: Build CEI test split
        shell: powershell
        run: |
          $dataRoot = Split-Path -Parent $env:CEI_DATA_DIR
          $lulcCeiDir = Split-Path -Parent $dataRoot
          $splitScript = Join-Path $lulcCeiDir "tools\cei\make_test_split.py"

          if (-not (Test-Path -Path $splitScript -PathType Leaf)) {
            Write-Error "Expected split script does not exist: $splitScript"
            exit 1
          }

          Push-Location $lulcCeiDir
          try {
            & "$env:PYTHON" $splitScript
          }
          finally {
            Pop-Location
          }
