name: Export class-id masks

on:
  push:
    branches:
      - main

jobs:
  export-and-copy:
    name: Export masks and copy to lulc-cei
    runs-on:
      - self-hosted
      - Windows
      - desktop
    env:
      CEI_DATA_DIR: ${{ vars.CEI_DATA_DIR }}

    steps:
      - name: Checkout CEI-Dataset
        uses: actions/checkout@v4

      - name: Find Python
        shell: pwsh
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) {
            $python = Get-Command py -ErrorAction SilentlyContinue
          }

          if (-not $python) {
            Write-Error "Python is not installed or is not on PATH for this runner."
            exit 1
          }

          "PYTHON=$($python.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          & "$env:PYTHON" -m pip install -r requirements.txt

      - name: Export RGB masks to class-id masks
        shell: pwsh
        run: |
          & "$env:PYTHON" rgb_to_class_id.py --stats

      - name: Copy masks to lulc-cei
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CEI_DATA_DIR)) {
            Write-Error "Missing GitHub Actions variable: CEI_DATA_DIR. Set it to the absolute path of the CEI_data folder on the Windows Desktop runner."
            exit 1
          }

          if (-not (Test-Path -Path $env:CEI_DATA_DIR -PathType Container)) {
            Write-Error "Expected destination directory does not exist: $env:CEI_DATA_DIR"
            exit 1
          }

          $destMasks = Join-Path $env:CEI_DATA_DIR "masks"
          New-Item -ItemType Directory -Force -Path $destMasks | Out-Null
          Copy-Item -Path "data\masks\*" -Destination $destMasks -Recurse -Force

      - name: Build CEI test split
        shell: pwsh
        run: |
          $dataRoot = Split-Path -Parent $env:CEI_DATA_DIR
          $lulcCeiDir = Split-Path -Parent $dataRoot
          $splitScript = Join-Path $lulcCeiDir "tools\cei\make_test_split.py"

          if (-not (Test-Path -Path $splitScript -PathType Leaf)) {
            Write-Error "Expected split script does not exist: $splitScript"
            exit 1
          }

          Push-Location $lulcCeiDir
          try {
            & "$env:PYTHON" $splitScript
          }
          finally {
            Pop-Location
          }
